<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plaza China Translator</title>

    <link rel="icon" type="image/png" href="icono.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">

            <img src="logo.png"
                 alt="Plaza China Translator"
                 class="logo">

            <h1>Plaza China Translator</h1>

        </header>

        <section class="card">

            <label for="translationType">
                Tipo de traducción
            </label>

            <select id="translationType">

                <option value="informal" selected>
                    💬 Chat informal
                </option>

                <option value="boss">
                    👔 Conversación con jefe
                </option>

                <option value="manual">
                    📋 Manual de procedimientos
                </option>

                <option value="notice">
                    📢 Aviso para empleados
                </option>

                <option value="regulation">
                    📜 Reglamento
                </option>

                <option value="official">
                    ✉ Comunicado oficial
                </option>

            </select>

            <label for="inputText">
                Texto en español
            </label>

            <textarea
                id="inputText"
                placeholder="Escribe aquí el texto que deseas traducir..."
                maxlength="5000"></textarea>

            <div class="counter">
                Caracteres:
                <span id="charCount">0</span>
            </div>

            <div class="buttons">

                <button id="translateButton">
                    Traducir
                </button>

                <button id="clearButton">
                    Limpiar
                </button>

            </div>

        </section>

        <section class="card">

            <label for="outputText">
                Traducción
            </label>

            <textarea
                id="outputText"
                readonly
                placeholder="La traducción aparecerá aquí..."></textarea>

            <div class="buttons">

                <button id="copyButton">
                    Copiar
                </button>

            </div>

        </section>

        <footer>

            Plaza China Translator v1.0
            <br>
            Powered by OpenAI

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
